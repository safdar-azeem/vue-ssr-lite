name: Vue hydration compatibility

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hydration:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Minimum supported release and the highest available supported patch.
        vue: ['3.5.0', '~3.5.0']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install the selected Vue compatibility endpoint
        run: npm install --no-save --package-lock=false "vue@${{ matrix.vue }}"
      - name: Exercise renderer compatibility and fetch hydration
        run: >-
          npx vitest run
          src/hydration/SsrVueHydrationCompatibility.test.ts
          src/SsrHydrationRuntime.test.ts
          src/data/fetch/__tests__/useFetch.test.ts
          src/data/fetch/__tests__/SsrFetchHydration.test.ts
